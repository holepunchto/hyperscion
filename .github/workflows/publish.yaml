name: Publish
on:
  push:
    tags:
      - v*
permissions:
  id-token: write
  contents: write
jobs:
  # publishes create-hs, so `npm init hs` fetches the hs binary peer-to-peer (install.js)
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
    name: Publish
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: holepunchto/actions/publish@v1
        with:
          workspaces: true
